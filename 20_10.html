<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c0a22">
<title>Gửi em 20/10 💐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff7eb6;--hot:#ff4f9a;--ink:#5a2a42;--bg1:#34123a;--bg2:#0d0512}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2) 72%);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#ffe3ef;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 4.5vh);text-align:center;opacity:0;transition:opacity 2.5s;pointer-events:none;padding:0 16px}
.top.show{opacity:1}
.top h1{font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(2.1rem,7.5vw,3.6rem);line-height:1.1;text-shadow:0 0 24px rgba(255,79,154,.8)}
.top p{font-weight:300;font-size:clamp(.8rem,2.6vw,.95rem);opacity:.75;margin-top:6px}
.btn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 5vh);transform:translate(-50%,16px);border:0;cursor:pointer;color:#fff;font:500 1rem 'Be Vietnam Pro',sans-serif;padding:15px 32px;border-radius:999px;background:linear-gradient(135deg,#ff7eb6,#e0397f);box-shadow:0 8px 30px rgba(255,79,154,.55);opacity:0;pointer-events:none;transition:opacity 1s,transform 1s;white-space:nowrap}
.btn.show{opacity:1;pointer-events:auto;transform:translate(-50%,0);animation:pulse 2.2s 1s infinite}
.btn:focus-visible,.close:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes pulse{0%,100%{box-shadow:0 8px 30px rgba(255,79,154,.5)}50%{box-shadow:0 8px 44px rgba(255,79,154,.95),0 0 0 10px rgba(255,126,182,.12)}}

#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,5,18,.6);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .6s;perspective:1400px;z-index:5}
#ov.on{opacity:1;pointer-events:auto}
.card{position:relative;width:min(90vw,400px);height:min(76vh,76dvh,560px);transform:scale(.7) rotate(-4deg);transition:transform .9s cubic-bezier(.2,1.2,.3,1)}
#ov.on .card{transform:none}
.paper{position:absolute;inset:0;border-radius:6px 16px 16px 6px;background:linear-gradient(160deg,#fffafc,#ffe9f2);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,126,182,.35);padding:30px 26px 22px;overflow-y:auto;display:flex;flex-direction:column;text-align:center}
.paper h2{font-family:'Dancing Script',cursive;font-size:clamp(1.9rem,8vw,2.5rem);color:#d6336c;line-height:1.1;margin-bottom:14px}
.msg{flex:1;font-weight:400;font-size:clamp(.92rem,3.8vw,1.02rem);line-height:1.75}
.msg p{margin-bottom:12px;opacity:0;transform:translateY(8px)}
.open .msg p,.open .sig{animation:in .9s forwards;animation-delay:calc(var(--i)*.9s + 1.3s)}
.sig{font-family:'Dancing Script',cursive;font-size:1.6rem;color:#d6336c;margin-top:6px;opacity:0}
@keyframes in{to{opacity:1;transform:none}}
.close{margin:14px auto 0;border:1px solid rgba(214,51,108,.5);background:transparent;color:#d6336c;padding:8px 22px;border-radius:999px;font:400 .9rem 'Be Vietnam Pro',sans-serif;cursor:pointer}
.cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.6,0,.2,1)}
.open .cover{transform:rotateY(-172deg)}
.face{position:absolute;inset:0;border-radius:6px 16px 16px 6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.front{background:radial-gradient(circle at 50% 38%,#ff8fc0,#d6336c 70%);color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3)}
.front b{font-family:'Dancing Script',cursive;font-size:clamp(3.4rem,16vw,5rem);text-shadow:0 4px 18px rgba(120,0,50,.5)}
.front span{font-weight:300;letter-spacing:.06em}
.front i{font-style:normal;font-size:2rem}
.back{transform:rotateY(180deg);background:linear-gradient(200deg,#ffd3e5,#ffb3d3);box-shadow:inset 0 0 40px rgba(214,51,108,.25)}
@media (prefers-reduced-motion:reduce){.btn.show{animation:none}.cover{transition-duration:.01s}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top" id="top">
  <h1 id="t1"></h1>
  <p id="t2"></p>
</div>
<button class="btn" id="btn" type="button">Chạm để mở thiệp 💌</button>

<div id="ov" role="dialog" aria-modal="true" aria-label="Thiệp chúc mừng">
  <div class="card" id="card">
    <div class="paper">
      <h2 id="to"></h2>
      <div class="msg" id="msg"></div>
      <div class="sig" id="sig"></div>
      <button class="close" id="close" type="button">Đóng thiệp</button>
    </div>
    <div class="cover">
      <div class="face front"><i>🌸</i><b>20/10</b><span id="cv"></span></div>
      <div class="face back"></div>
    </div>
  </div>
</div>

<script>
/* ====== SỬA NỘI DUNG Ở ĐÂY ====== */
const CONFIG = {
  title: "Chúc mừng 20/10",
  subtitle: "Mỗi ngôi sao là một lý do anh yêu em",
  cover: "Dành tặng em",
  to: "Gửi em yêu 💗",
  lines: [
    "Nhân ngày Phụ nữ Việt Nam 20/10, anh chỉ muốn nói rằng em là điều đẹp đẽ nhất trong cuộc sống của anh.",
    "Cảm ơn em vì đã đến với anh, kiên nhẫn và yêu thương anh theo cách riêng của em.",
    "Mong em luôn xinh đẹp, thật nhiều niềm vui và được yêu thương mỗi ngày - như bó hoa nhỏ này, được ghép từ muôn vàn vì sao."
  ],
  sign: "Anh của em 💕"
};
/* ================================ */

const $ = id => document.getElementById(id);
$('t1').textContent = CONFIG.title;
$('t2').textContent = CONFIG.subtitle;
$('cv').textContent = CONFIG.cover;
$('to').textContent = CONFIG.to;
$('sig').textContent = CONFIG.sign;
$('sig').style.setProperty('--i', CONFIG.lines.length);
CONFIG.lines.forEach((l, i) => {
  const p = document.createElement('p'); p.textContent = l; p.style.setProperty('--i', i); $('msg').appendChild(p);
});

/* ---------- Vẽ bó hoa ẩn để lấy điểm ---------- */
const BW = 360, BH = 460;
function drawBouquet() {
  const c = document.createElement('canvas'); c.width = BW; c.height = BH;
  const g = c.getContext('2d', { willReadFrequently: true });
  const leaf = (x, y, rot, l, w) => {
    g.save(); g.translate(x, y); g.rotate(rot);
    g.fillStyle = '#86d69a'; g.beginPath(); g.ellipse(0, 0, l, w, 0, 0, 7); g.fill();
    g.strokeStyle = '#4fae70'; g.lineWidth = 3; g.beginPath(); g.moveTo(-l * .9, 0); g.lineTo(l * .9, 0); g.stroke();
    g.restore();
  };
  leaf(48, 200, -.9, 44, 14); leaf(312, 200, .9, 44, 14);
  leaf(40, 140, -1.15, 40, 13); leaf(320, 140, 1.15, 40, 13);
  leaf(75, 85, -.6, 36, 12); leaf(285, 85, .6, 36, 12);
  leaf(120, 50, -.35, 32, 11); leaf(240, 50, .35, 32, 11);
  leaf(60, 255, -.5, 44, 14); leaf(300, 255, .5, 44, 14);
  g.fillStyle = '#fff0f6';
  for (let i = 0; i < 34; i++) { const a = Math.random() * 6.283, d = 135 + Math.random() * 35; g.beginPath(); g.arc(180 + Math.cos(a) * d * 1.08, 165 + Math.sin(a) * d * .95, 3.2, 0, 7); g.fill(); }

  const roses = [[180, 88, 38], [125, 108, 38], [235, 108, 38], [78, 150, 37], [180, 138, 40], [282, 150, 37], [128, 178, 40], [232, 178, 40], [80, 218, 36], [180, 210, 40], [280, 218, 36], [130, 246, 38], [230, 246, 38], [180, 266, 34]];
  g.lineCap = 'round'; g.strokeStyle = '#4fae70'; g.lineWidth = 7;
  roses.forEach(r => { g.beginPath(); g.moveTo(180, 300); g.lineTo(r[0], r[1]); g.stroke(); });

  g.fillStyle = '#ffc6de';
  g.beginPath(); g.moveTo(180, 452); g.lineTo(58, 275); g.quadraticCurveTo(180, 318, 302, 275); g.closePath(); g.fill();
  g.strokeStyle = '#ff8fc0'; g.lineWidth = 3;
  [-60, -30, 0, 30, 60].forEach(d => { g.beginPath(); g.moveTo(180, 446); g.lineTo(180 + d * 1.9, 300 - Math.abs(d) * .15); g.stroke(); });

  const palette = [['#ff4f9a', '#d6246e', '#ff9ac6'], ['#ff77ae', '#e0397f', '#ffb3d3'], ['#f2307f', '#b8175a', '#ff7eb6']];
  roses.slice().sort((a, b) => a[1] - b[1]).forEach((r, n) => {
    const [x, y, R] = r, [c1, c2, c3] = palette[n % 3];
    g.fillStyle = c1; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill();
    g.lineCap = 'round';
    for (let k = 0; k < 6; k++) {
      g.strokeStyle = k % 2 ? c3 : c2; g.lineWidth = R * .13;
      const rr = R * (.93 - k * .15), a0 = k * 1.9;
      g.beginPath(); g.arc(x + Math.cos(a0) * R * .05 * k, y + Math.sin(a0) * R * .05 * k, rr, a0, a0 + 4.3); g.stroke();
    }
    g.fillStyle = c2; g.beginPath(); g.arc(x, y, R * .12, 0, 7); g.fill();
  });

  g.fillStyle = '#ff3d8f';
  g.beginPath(); g.ellipse(145, 335, 34, 17, .35, 0, 7); g.fill();
  g.beginPath(); g.ellipse(215, 335, 34, 17, -.35, 0, 7); g.fill();
  g.fillStyle = '#ffd0e3'; g.beginPath(); g.arc(180, 338, 11, 0, 7); g.fill();


  const data = g.getImageData(0, 0, BW, BH).data, pts = [], step = 5;
  for (let y = 0; y < BH; y += step) for (let x = 0; x < BW; x += step) {
    const i = (y * BW + x) * 4; if (data[i + 3] < 128) continue;
    pts.push({ bx: x + (Math.random() - .5) * 3, by: y + (Math.random() - .5) * 3, c: [data[i], data[i + 1], data[i + 2]] });
  }
  return pts;
}

/* ---------- Sprite ngôi sao (cache theo màu) ---------- */
const sprites = {};
function star(rgb) {
  const q = rgb.map(v => Math.min(255, Math.round((v + 40) / 32) * 32));
  const key = q.join();
  if (sprites[key]) return sprites[key];
  const S = 32, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), col = `rgb(${q})`;
  const gr = g.createRadialGradient(16, 16, 2, 16, 16, 16);
  gr.addColorStop(0, `rgba(${q},.55)`); gr.addColorStop(1, `rgba(${q},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 4.2 : 9.5, a = -Math.PI / 2 + i * Math.PI / 5; g[i ? 'lineTo' : 'moveTo'](16 + Math.cos(a) * r, 16 + Math.sin(a) * r); }
  g.closePath(); g.fill();
  return sprites[key] = c;
}

/* ---------- Khởi tạo ---------- */
const cv = $('c'), ctx = cv.getContext('2d');
let W, H, DPR, s, ox, oy, R;
const P = drawBouquet().map(p => ({
  ...p, a: Math.random() * 6.283, rr: .65 + Math.random() * .5,
  d: Math.random() * 2.4, dur: 1.9 + Math.random() * 1.4,
  sw: (Math.random() - .5) * 160, ph: Math.random() * 6.283, sz: .85 + Math.random() * .6, spr: star(p.c)
}));
const bg = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), z: .3 + Math.random(), ph: Math.random() * 6 }));
let bursts = [];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  s = Math.min(W * .9 / BW, H * .6 / BH);
  ox = (W - BW * s) / 2; oy = H * .17 + (H * .6 - BH * s) / 2;
  R = Math.hypot(W, H) * .6;
}
addEventListener('resize', resize); resize();

let t0 = null, ready = false;
function frame(ts) {
  if (t0 === null) t0 = ts;
  const t = (ts - t0) / 1000;
  ctx.clearRect(0, 0, W, H);

  for (const b of bg) {
    ctx.globalAlpha = (.25 + .5 * Math.abs(Math.sin(t * b.z + b.ph))) * .8;
    ctx.fillStyle = '#ffd6e8'; ctx.beginPath();
    ctx.arc(b.x * W, (b.y * H + t * 4 * b.z) % H, b.z * 1.3, 0, 7); ctx.fill();
  }

  const cx = W / 2, cy = H / 2;
  for (const p of P) {
    let k = (t - p.d) / p.dur; k = k < 0 ? 0 : k > 1 ? 1 : k;
    const e = 1 - Math.pow(1 - k, 3);
    const tx = ox + p.bx * s, ty = oy + p.by * s;
    const sx = cx + Math.cos(p.a) * R * p.rr, sy = cy + Math.sin(p.a) * R * p.rr;
    let x = sx + (tx - sx) * e, y = sy + (ty - sy) * e;
    const dx = tx - sx, dy = ty - sy, len = Math.hypot(dx, dy) || 1, w = Math.sin(k * Math.PI) * p.sw;
    x += -dy / len * w; y += dx / len * w;
    x += Math.sin(t * 1.3 + p.by * .02) * (1 - p.by / BH) * 2.5 * s * e;
    const tw = k >= 1 ? .7 + .35 * Math.sin(t * 3 + p.ph) : 1;
    const size = 6.5 * s * p.sz * (.4 + .6 * e) * tw;
    ctx.globalAlpha = Math.min(1, k * 3);
    ctx.drawImage(p.spr, x - size / 2, y - size / 2, size, size);
  }

  bursts = bursts.filter(b => (b.l -= .016) > 0);
  for (const b of bursts) {
    b.x += b.vx; b.y += b.vy; b.vy += .05; b.vx *= .99;
    ctx.globalAlpha = Math.min(1, b.l);
    ctx.drawImage(b.spr, b.x - b.s / 2, b.y - b.s / 2, b.s, b.s);
  }
  ctx.globalAlpha = 1;

  if (!ready && t > 5.2) { ready = true; $('btn').classList.add('show'); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => $('top').classList.add('show'), 400);

/* ---------- Mở / đóng thiệp ---------- */
function burst() {
  const cols = [[255, 126, 182], [255, 79, 154], [255, 200, 225], [255, 255, 255]];
  for (let i = 0; i < 110; i++) {
    const a = Math.random() * 6.283, v = 2 + Math.random() * 7;
    bursts.push({ x: W / 2, y: H / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, l: 1.2 + Math.random() * 1.6, s: 10 + Math.random() * 18, spr: star(cols[i % 4]) });
  }
}
function openCard() {
  if (!ready) return;
  $('ov').classList.add('on'); burst();
  setTimeout(() => $('card').classList.add('open'), 750);
  $('close').focus({ preventScroll: true });
}
function closeCard() { $('card').classList.remove('open'); $('ov').classList.remove('on'); }
$('btn').addEventListener('click', openCard);
cv.addEventListener('click', openCard);
$('close').addEventListener('click', closeCard);
addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });
</script>
</body>
</html>
